name: Apple certificates

# Fails when Apple publishes a new WWDR intermediate (or changes a root) that the signer does not
# bundle yet. Fix: run `pnpm --filter @ipaforge/signer update-apple-certificates`, review, commit.
on:
  schedule:
    - cron: "17 6 1 * *" # monthly, 1st day 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ipaforge/signer update-apple-certificates -- --check
      - name: Warn about certificates expiring within 12 months
        run: pnpm vitest run packages/signer/src/infrastructure/cms/chain.test.ts
