name: Apple certificates

# Fails when Apple publishes a new WWDR intermediate (or changes a root) that the signer does not
# bundle yet. Fix: run `pnpm --filter @loadstar/signer update-apple-certificates`, review, commit.
on:
  schedule:
    - cron: "17 6 1 * *" # monthly, 1st day 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @loadstar/signer update-apple-certificates -- --check
      - name: Warn about certificates expiring within 12 months
        run: pnpm vitest run packages/signer/src/infrastructure/cms/chain.test.ts
