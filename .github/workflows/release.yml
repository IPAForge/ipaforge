name: Release

# Builds the installers on macOS, Windows and Linux and publishes them as a GitHub release when a version tag is
# pushed (v0.1.0-alpha.1). A tag with a pre-release part (-alpha, -beta, -rc) becomes a pre-release. The release
# notes come from docs/releases/<version>.md. Every file gets a Sigstore signature (<file>.sigstore.json) made with
# this workflow's GitHub identity, so anyone can check it was built here from that tag. A pull request that changes the packaging builds them too, without
# publishing, so a release never finds out first.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/build/**
      - apps/desktop/package.json
      - apps/desktop/src/main/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # Every system reports its own result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the app is ${version}"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ipaforge/desktop exec electron-vite build
      - run: pnpm --filter @ipaforge/desktop exec electron-builder ${{ matrix.target }} --publish never
        env:
          # electron-builder skips signing on pull requests; the macOS app must still get its ad-hoc signature, or
          # it keeps Electron's own one, which no longer matches the bundle, and macOS refuses to start it.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: The macOS apps are validly signed
        if: runner.os == 'macOS'
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            mount="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
            codesign --verify --deep --strict --verbose=2 "$mount/IPAForge.app"
            codesign -dv "$mount/IPAForge.app" 2>&1 | grep -q '^Identifier=io.github.sirready.ipaforge$'
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # On a pull request this checks the checksums and signatures and stops before publishing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signs with the workflow's OIDC identity: no key to keep.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signatures
        working-directory: dist
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file" > /dev/null
          done
      - name: The signatures verify
        working-directory: dist
        run: |
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done
          ls -la
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # A release made on GitHub's web page (which created the tag) keeps its title and notes: only the files
          # are added. Otherwise the release is created here, with the notes from docs/releases/.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            notes="docs/releases/${version}.md"
            test -f "$notes" || { echo "missing $notes"; exit 1; }
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "IPAForge ${version}" \
              --notes-file "$notes" \
              $prerelease
          fi
