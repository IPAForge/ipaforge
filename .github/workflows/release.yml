name: Release

# Builds the installers on macOS, Windows and Linux and publishes them as a GitHub release when a version tag is
# pushed (v0.1.0-alpha.5). A tag with a pre-release part (-alpha, -beta, -rc) becomes a pre-release. The release
# notes come from docs/releases/<version>.md. Every file gets a Sigstore signature (<file>.sigstore.json) made with
# this workflow's GitHub identity, so anyone can check it was built here from that tag. The macOS app is signed with
# IPAForge's self-signed certificate (secrets MAC_CODESIGN_P12 and MAC_CODESIGN_PASSWORD), so the keychain
# recognises every version. A pull request that changes the packaging builds them too, without publishing, so a
# release never finds out first.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/build/**
      - apps/desktop/package.json
      - apps/desktop/src/main/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # Every system reports its own result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    # macOS signing certificate, from two repository secrets (Settings › Secrets and variables › Actions):
    #   MAC_CODESIGN_P12       the self-signed "IPAForge Self-Signed Code Signing" certificate with its private key,
    #                          a .p12 file encoded with `base64 -i ipaforge-codesign.p12` (RSA 3072, valid until 2036)
    #   MAC_CODESIGN_PASSWORD  the .p12's password
    # The maintainer keeps the .p12 and its password offline; GitHub never shows a secret's value. To set them again:
    #   base64 -i ipaforge-codesign.p12 | gh secret set MAC_CODESIGN_P12
    #   gh secret set MAC_CODESIGN_PASSWORD < p12-password.txt
    # Without them (forks) the app stays ad-hoc signed. Don't replace the certificate: its fingerprint below is what
    # every user's keychain trusts, and a new one would make it ask everyone again.
    env:
      HAVE_MAC_CERTIFICATE: ${{ secrets.MAC_CODESIGN_P12 != '' }}
      # The certificate's SHA-1, as codesign reports it in the app's designated requirement.
      MAC_CERTIFICATE_SHA1: 72fc71d719dcb0c2bf3caf939a41d6c3afb1da63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the app is ${version}"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - name: The macOS signing certificate
        if: runner.os == 'macOS' && env.HAVE_MAC_CERTIFICATE == 'true'
        env:
          MAC_CODESIGN_P12: ${{ secrets.MAC_CODESIGN_P12 }}
          MAC_CODESIGN_PASSWORD: ${{ secrets.MAC_CODESIGN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MAC_CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$keychain" -P "$MAC_CODESIGN_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign finds an identity only in a keychain on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain" | grep -qi "$MAC_CERTIFICATE_SHA1"
          echo "IPAFORGE_CODESIGN_HASH=$MAC_CERTIFICATE_SHA1" >> "$GITHUB_ENV"
      - run: pnpm --filter @ipaforge/desktop exec electron-vite build
      - run: pnpm --filter @ipaforge/desktop exec electron-builder ${{ matrix.target }} --publish never
        env:
          # electron-builder skips signing on pull requests; the macOS app must still get its ad-hoc signature, or
          # it keeps Electron's own one, which no longer matches the bundle, and macOS refuses to start it.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: The macOS apps are validly signed
        if: runner.os == 'macOS'
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            mount="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
            codesign --verify --deep --strict --verbose=2 "$mount/IPAForge.app"
            codesign -dv "$mount/IPAForge.app" 2>&1 | grep -q '^Identifier=io.github.sirready.ipaforge$'
            if [ "$HAVE_MAC_CERTIFICATE" = true ]; then
              codesign -d -r- "$mount/IPAForge.app" 2>&1 | grep -qi "certificate root = H\"$MAC_CERTIFICATE_SHA1\""
            fi
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # On a pull request this checks the checksums and signatures and stops before publishing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signs with the workflow's OIDC identity: no key to keep.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signatures
        working-directory: dist
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file" > /dev/null
          done
      - name: The signatures verify
        working-directory: dist
        run: |
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done
          ls -la
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # A release made on GitHub's web page (which created the tag) keeps its title and notes: only the files
          # are added. Otherwise the release is created here, with the notes from docs/releases/.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            notes="docs/releases/${version}.md"
            test -f "$notes" || { echo "missing $notes"; exit 1; }
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "IPAForge ${version}" \
              --notes-file "$notes" \
              $prerelease
          fi
      # ipaforge.com shows the latest version and its notes: ask it to rebuild (SITE_DISPATCH_TOKEN, see
      # website.yml). A release published with this workflow's token starts no other workflow, so it's asked here.
      - name: Ask ipaforge.com to rebuild
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set: ipaforge.com was not asked to rebuild."
            exit 0
          fi
          gh api repos/IPAForge/ipaforge.github.io/dispatches -f event_type=app-released
