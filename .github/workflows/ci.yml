name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10; version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm check:locales
      - run: pnpm test
        env:
          # verbose engine logs when a run is re-run with debug logging enabled
          LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || 'info' }}

  # The Electron shell (main, preload, renderer) must build on every OS. Packaging comes in Phase 9.
  # Electron 44 fetches its binary on first launch, not on install, and the build never launches it.
  desktop-build:
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ipaforge/desktop build

  # Apple `codesign` is the signer's oracle: fixtures must still match it, and every Apple-verification
  # test (codesign --verify --deep --strict) runs here, plus the real SideStore end-to-end signing.
  macos-codesign:
    name: macos codesign parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report toolchain versions
        run: |
          sw_vers
          what /usr/bin/codesign | grep PROJECT
          xcrun --sdk iphoneos --show-sdk-version
      - name: Fixtures still match this codesign (toolchain drift check)
        run: fixtures/signer/generate.sh --check
      - name: Signer tests incl. Apple verification
        run: pnpm vitest run --project @ipaforge/signer
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/e2e
          key: e2e-sidestore-0.7.0-alpha
      - name: SideStore end to end
        run: pnpm vitest run packages/signer/src/application/sign-ipa.test.ts
        env:
          IPAFORGE_E2E: "1"

  # Layout and accessibility tests in a real Chromium (cut-off translations, text out of its box, WCAG), in
  # Playwright's image, so fonts match those the website's screenshots are made with.
  ui-browser:
    name: ui layout and accessibility
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
