version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses releases younger than a day (supply-chain policy); let them settle first
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      tooling:
        patterns: ["@biomejs/*", "vitest", "@vitest/*", "typescript", "turbo", "tsx", "esbuild", "@types/*"]
      crypto-and-formats:
        patterns: ["pkijs", "asn1js", "@noble/*", "@zip.js/*", "zod"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
