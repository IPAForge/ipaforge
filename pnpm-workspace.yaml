packages:
  - "packages/*"
  - "apps/*"
  - "tooling/eslint"

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  # Squirrel.Windows only; the Windows installer is NSIS, so its download script is not needed.
  electron-winstaller: false

patchedDependencies:
  '@sigstore/core@4.0.1': patches/@sigstore__core@4.0.1.patch
  '@tufjs/models@5.0.0': patches/@tufjs__models@5.0.0.patch

# Transitive dependencies pinned to their patched versions (Dependabot alerts).
overrides:
  undici@>=7 <7.30.1: 7.30.1
  fast-uri@<3.1.9: 3.1.9
  seroval@<1.6.11: 1.6.11
  glob@>=9 <14.0.2: 14.0.2
  minimatch@>=7 <11.0.1: 11.0.1
