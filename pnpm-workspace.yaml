packages:
  - "packages/*"
  - "apps/*"
  - "tooling/eslint"

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  # Squirrel.Windows only; the Windows installer is NSIS, so its download script is not needed.
  electron-winstaller: false

patchedDependencies:
  '@sigstore/core@4.0.1': patches/@sigstore__core@4.0.1.patch
  '@tufjs/models@5.0.0': patches/@tufjs__models@5.0.0.patch
