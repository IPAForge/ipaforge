# Installers for the alpha: `pnpm --filter @ipaforge/desktop dist` on each system (CI: .github/workflows/release.yml).
# Everything the app runs is bundled into out/ by electron-vite, so no node_modules are packaged.
# Not signed yet (Phase 9): macOS gets an ad-hoc signature so Apple silicon runs it; Windows shows SmartScreen.
appId: io.github.sirready.ipaforge
productName: IPAForge
copyright: Copyright © 2026 Dan Motpan and IPAForge contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc ("-"): no Apple Developer ID yet. Gatekeeper still asks on first open.
  identity: '-'
  hardenedRuntime: false
  notarize: false

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.png
  target:
    # x64 only: it also runs on Windows on Arm (emulated), and two arches would make one combined installer.
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  # The package name (@ipaforge/desktop) can't be a file name.
  executableName: ipaforge
  icon: build/icon.png
  category: Development
  synopsis: Install SideStore and your apps on iPhone and iPad
  maintainer: Dan Motpan <24751897+SirReaDy@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
