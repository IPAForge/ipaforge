# Installers for the alpha: `pnpm --filter @ipaforge/desktop dist` on each system (CI: .github/workflows/release.yml).
# Everything the app runs is bundled into out/ by electron-vite, so no node_modules are packaged.
# macOS: ad-hoc signed here, then re-signed in the release workflow with IPAForge's self-signed certificate
# (build/after-sign.mjs), so the keychain recognises every version. Not notarised: Gatekeeper asks on first open.
# Windows is not code-signed yet: SmartScreen asks.
appId: io.github.sirready.ipaforge
productName: IPAForge
copyright: Copyright © 2026 Dan Motpan and IPAForge contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Where updates will come from. Nothing is uploaded from here (`--publish never`); it makes electron-builder write
# the update metadata (latest.yml, latest-mac.yml, latest-linux*.yml) the release workflow attaches.
afterSign: build/after-sign.mjs

publish:
  provider: github
  owner: IPAForge
  repo: ipaforge
  releaseType: prerelease

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zipped app is what an update downloads.
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc ("-"): no Apple Developer ID yet. The release workflow's certificate replaces it (afterSign).
  identity: '-'
  hardenedRuntime: false
  notarize: false
  # Finding iPhones on Wi-Fi: macOS asks before an app looks on the local network, with this reason (translated in
  # build/mac-locales), and only for the Bonjour types listed.
  extendInfo:
    NSLocalNetworkUsageDescription: IPAForge looks for your iPhone and iPad on the local network, so it can install apps over Wi-Fi without a cable.
    NSBonjourServices:
      - _apple-mobdev2._tcp
      - _remotepairing._tcp
  extraResources:
    - from: build/mac-locales
      to: .
      filter: ['**/*']

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.png
  target:
    # x64 only: it also runs on Windows on Arm (emulated), and two arches would make one combined installer.
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  # The package name (@ipaforge/desktop) can't be a file name.
  executableName: ipaforge
  icon: build/icon.png
  category: Development
  synopsis: Install SideStore and your apps on iPhone and iPad
  maintainer: Dan Motpan <24751897+SirReaDy@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
